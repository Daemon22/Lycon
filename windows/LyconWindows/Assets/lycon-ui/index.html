<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' lycon-startpage: file:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; connect-src *;" />
  <title>Lycon</title>
  <link rel="stylesheet" href="styles/themes.css" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/tabs.css" />
</head>
<body>
  <!-- ============== Title bar (draggable on macOS hidden inset) ============== -->
  <header class="titlebar" aria-label="Lycon window controls">
    <div class="titlebar-drag"></div>
    <div class="titlebar-logo">
      <img src="./assets/wolf-logo.png" width="22" height="22" alt="Lycon" style="border-radius:4px;" />
      <span class="titlebar-name">Lycon</span>
    </div>
    <div class="titlebar-spacer"></div>
    <div class="titlebar-actions">
      <button id="win-min" title="Minimize" aria-label="Minimize">—</button>
      <button id="win-max" title="Maximize" aria-label="Maximize">▢</button>
      <button id="win-close" title="Close" aria-label="Close">✕</button>
    </div>
  </header>

  <!-- ============== Tab strip ============== -->
  <div class="tabstrip" id="tabstrip" role="tablist" aria-label="Open tabs">
    <div class="tabs" id="tabs"></div>
    <button class="tab-new" id="tab-new" title="New tab (Ctrl+T)" aria-label="Open a new tab">＋</button>
  </div>

  <!-- ============== Toolbar ============== -->
  <div class="toolbar" role="toolbar" aria-label="Browser navigation">
    <div class="toolbar-nav">
      <button id="nav-back" title="Back (Alt+←)" aria-label="Go back" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <button id="nav-forward" title="Forward (Alt+→)" aria-label="Go forward" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
      <button id="nav-reload" title="Reload (Ctrl+R)" aria-label="Reload page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.6-2M4 5v4h4M4 13a8.1 8.1 0 0 0 15.6 2M20 19v-4h-4"/></svg></button>
      <button id="nav-home" title="Home" aria-label="Open home page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8M5 10v10h14V10M9 20v-6h6v6"/></svg></button>
      <button id="nav-open-file" title="Open local file (Ctrl+O)" aria-label="Open a local file"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H10l2 2h5.5A2.5 2.5 0 0 1 20 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5v-11Z"/><path d="M4 10h16"/></svg></button>
    </div>

    <div class="urlbar-wrap">
      <div class="urlbar-security" id="urlbar-security" title="Site information">
        <svg id="sec-icon-lock" viewBox="0 0 24 24" width="14" height="14" style="display:none;"><path fill="currentColor" d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 0 1 6 0v3H9z"/></svg>
        <svg id="sec-icon-info" viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 15h-2v-6h2zm0-8h-2V7h2z"/></svg>
        <svg id="sec-icon-warning" viewBox="0 0 24 24" width="14" height="14" style="display:none;"><path fill="currentColor" d="M12 2 1 21h22L12 2zm0 4 8 14H4l8-14zm-1 4v5h2v-5zm0 6v2h2v-2z"/></svg>
      </div>
      <div class="urlbar-shields" id="shields-btn" title="Lycon Shields — ads & trackers blocked" role="button" tabindex="0" aria-label="Lycon Shields">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 2 L4 5 V11 C4 16 7 20 12 22 C17 20 20 16 20 11 V5 Z"/></svg>
        <span class="shields-count" id="shields-count">0</span>
      </div>
      <button class="urlbar-posture" id="posture-btn" title="Security sensitivity: Balanced. Open settings to change." aria-label="Security sensitivity: Balanced">
        <span class="posture-dot" aria-hidden="true"></span><span id="posture-label">Balanced</span>
      </button>
      <input id="urlbar" class="urlbar" type="text" placeholder="Search, enter a URL, or open a local path" autocomplete="off" spellcheck="false" aria-label="Search, enter a URL, or open a local path" />
      <button id="urlbar-bookmark" class="urlbar-action" title="Bookmark this page" aria-label="Bookmark this page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg></button>
    </div>

    <div class="toolbar-actions" aria-label="Browser tools">
      <button id="act-downloads" title="Downloads (Ctrl+J)" aria-label="Open downloads"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M4 17v2h16v-2"/></svg></button>
      <button id="act-bookmarks" title="Bookmarks (Ctrl+B)" aria-label="Open bookmarks"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v17l-6-3-6 3V4Z"/></svg></button>
      <button id="act-history" title="History (Ctrl+H)" aria-label="Open history"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2"/></svg></button>
      <button id="act-private" title="New private tab (Ctrl+Shift+P)" aria-label="Open a new private tab"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19v-1a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v1M8 9a4 4 0 1 0 8 0M3 11h18"/></svg></button>
      <button id="act-agent" title="Optional intelligence" aria-label="Open optional intelligence panel"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v2a6 6 0 0 0 12 0V9a6 6 0 0 0-6-6Z"/><path d="M3 11a9 9 0 0 0 18 0M12 20v1M8 21h8"/></svg></button>
      <button id="act-menu" title="Menu" aria-label="Open menu"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
  </div>

  <!-- ============== Find bar ============== -->
  <div class="findbar hidden" id="findbar" role="search" aria-label="Find in page">
    <input id="find-input" type="text" placeholder="Find in page" spellcheck="false" />
    <span id="find-count" class="find-count">0/0</span>
    <button id="find-prev" title="Previous (Shift+Enter)" aria-label="Previous match">▲</button>
    <button id="find-next" title="Next (Enter)" aria-label="Next match">▼</button>
    <button id="find-close" title="Close (Esc)" aria-label="Close find bar">✕</button>
  </div>

  <!-- ============== Content area (webviews) ============== -->
  <div class="content" id="content" aria-live="polite"></div>

  <!-- ============== Sidebar panels ============== -->
  <aside class="sidebar hidden" id="sidebar" aria-label="Browser panel">
    <header class="sidebar-header">
      <h2 id="sidebar-title">Panel</h2>
      <button id="sidebar-close" aria-label="Close panel">✕</button>
    </header>
    <div class="sidebar-body" id="sidebar-body"></div>
  </aside>

  <!-- ============== Optional intelligence panel ============== -->
  <aside class="agent-panel hidden" id="agent-panel" aria-label="Optional intelligence">
    <header class="agent-panel-header">
      <div class="agent-panel-title"><span class="agent-panel-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6v2a6 6 0 0 0 12 0V9a6 6 0 0 0-6-6Z"/><path d="M3 11a9 9 0 0 0 18 0M12 20v1M8 21h8"/></svg></span><span><strong>Optional intelligence</strong><small>Connect only what you choose</small></span></div>
      <button id="agent-panel-close" class="icon-button" aria-label="Close optional intelligence panel"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6 18 18M18 6 6 18"/></svg></button>
    </header>
    <div class="agent-panel-body" id="agent-panel-body"></div>
  </aside>

  <!-- ============== Menu dropdown ============== -->
  <div class="menu-dropdown hidden" id="menu-dropdown">
    <button data-action="new-tab">New Tab<span class="kbd">Ctrl+T</span></button>
    <button data-action="new-private">New Private Tab<span class="kbd">Ctrl+Shift+P</span></button>
    <button data-action="open-file">Open Local File<span class="kbd">Ctrl+O</span></button>
    <div class="menu-sep"></div>
    <button data-action="find">Find in Page<span class="kbd">Ctrl+F</span></button>
    <button data-action="downloads">Downloads<span class="kbd">Ctrl+J</span></button>
    <button data-action="bookmarks">Bookmarks<span class="kbd">Ctrl+B</span></button>
    <button data-action="history">History<span class="kbd">Ctrl+H</span></button>
    <div class="menu-sep"></div>
    <button data-action="devtools">Toggle DevTools<span class="kbd">F12</span></button>
    <button data-action="screenshot">Screenshot</button>
    <div class="menu-sep"></div>
    <button data-action="agents">Optional intelligence</button>
    <button data-action="settings">Settings</button>
    <button data-action="about">About Lycon</button>
  </div>

  <!-- ============== Status bar (hover links) ============== -->
  <div class="statusbar hidden" id="statusbar"></div>

  <!-- ============== Modal host ============== -->
  <div class="modal-host hidden" id="modal-host" role="presentation">
    <div class="modal" id="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
  </div>

  <!-- ============== Scripts ============== -->
  <!-- Bridge MUST load first — it provides window.lycon used by all UI modules -->
  <script src="bridge/bridge.js"></script>
  <script src="js/state.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/shields.js"></script>
  <script src="js/bookmarks.js"></script>
  <script src="js/history.js"></script>
  <script src="js/downloads.js"></script>
  <script src="js/private.js"></script>
  <script src="js/finder.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/agents.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/startpage.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
