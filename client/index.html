<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#120f18" />
    <meta name="description" content="Lycon — a local-first browsing workspace with deliberate online handoffs." />
    <link rel="icon" type="image/png" href="/assets/lycon-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Lycon Browser — Local by Default</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Umami analytics — only bootstrapped when endpoint + website id are configured.
         Guards against a blind request to /umami (404) in environments without analytics. -->
    <script>
      (function () {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%".trim();
        var websiteId = "%VITE_ANALYTICS_WEBSITE_ID%".trim();
        if (endpoint && websiteId) {
          var umami = document.createElement("script");
          umami.src = endpoint.replace(/\/+$/, "") + "/umami";
          umami.defer = true;
          umami.setAttribute("data-website-id", websiteId);
          document.head.appendChild(umami);
        }
      })();
    </script>
  </body>
</html>
